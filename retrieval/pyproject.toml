[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "beken-retrieval"
version = "0.1.0"
description = "Domain-aware hybrid legal retrieval for Beken.ai"
requires-python = ">=3.12,<3.14"
dependencies = [
  "bm25s>=0.3.11,<0.4",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "qdrant-client>=1.19,<1.20",
]

[project.optional-dependencies]
models = [
  "onnxruntime>=1.29,<2",
  "sentence-transformers>=6.1,<7",
  "transformers>=5.18,<6",
]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]
dev = [
  "pip-audit>=2.10,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
beken-retrieval = "beken_retrieval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/beken_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
