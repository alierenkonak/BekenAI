name: Security audit

# Pull requests and pushes are audited by CI. This weekly run catches advisories
# published while the repository does not change; a failed run emails the owner.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, 09:17 in Türkiye
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The lockfile is enough; nothing is installed.
      - run: npm audit --audit-level=high

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install hash-locked pip-audit
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/ci.lock"
      - name: Audit CI and server locks
        run: .github/scripts/audit-python-locks.sh

  qdrant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the pinned Qdrant image against its advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_qdrant_advisories.py
