name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./backend[dev]" -e "./ingestion[dev]" -e "./retrieval[dev,server]"
      - name: Audit Python dependencies
        run: |
          pip-audit --local --progress-spinner off
          # PyPI advisory matching ignores the official PyTorch "+cpu" local tag.
          # Normalize only that tag so the pinned Oracle runtime cannot escape audit.
          sed 's/+cpu//' deploy/oracle/constraints.txt > /tmp/bekenai-oracle-audit.txt
          pip-audit --requirement /tmp/bekenai-oracle-audit.txt --no-deps --disable-pip --progress-spinner off
      - run: ruff check backend ingestion retrieval
      - run: pytest backend/tests ingestion/tests retrieval/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./backend[dev]" -e "./ingestion[dev]" -e "./retrieval[dev]"
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres qdrant
      - name: Validate corpus migrations
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U beken -d beken < "$migration"
          done
      - name: Run database integration tests
        env:
          BEKEN_RUN_DB_TESTS: "1"
          DATABASE_URL: postgresql://beken:local-development-only@localhost:5432/beken
        run: pytest backend/tests/test_stage3_database_integration.py ingestion/tests/test_database_integration.py retrieval/tests/test_postgres_integration.py
      - name: Run Qdrant integration test with fake encoder
        env:
          BEKEN_RUN_QDRANT_TESTS: "1"
          QDRANT_URL: http://localhost:6333
        run: pytest retrieval/tests/test_qdrant_integration.py
      - name: Stop test infrastructure
        if: always()
        run: docker compose down --volumes
