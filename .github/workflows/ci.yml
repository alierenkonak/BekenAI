name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # npm audit at the high level, with reviewed exceptions for dev-only tooling.
      - run: python3 ../.github/scripts/audit_npm.py
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install hash-locked Python dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/ci.lock"
      - name: Audit Python dependencies
        run: .github/scripts/audit-python-locks.sh
      - name: Install local projects without dependency resolution
        run: |
          python -m pip install --no-deps --no-build-isolation -e "./backend[dev]" -e "./ingestion[dev]" -e "./retrieval[dev,server]"
          python -m pip check
      - run: ruff check backend ingestion retrieval
      - run: pytest backend/tests ingestion/tests retrieval/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install hash-locked Python dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/ci.lock"
      - name: Audit Python dependencies
        run: pip-audit --requirement requirements/ci.lock --no-deps --disable-pip --progress-spinner off
      - name: Install local projects without dependency resolution
        run: |
          python -m pip install --no-deps --no-build-isolation -e "./backend[dev]" -e "./ingestion[dev]" -e "./retrieval[dev]"
          python -m pip check
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres qdrant
      - name: Validate corpus migrations
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U beken -d beken < "$migration"
          done
      - name: Run database integration tests
        env:
          BEKEN_RUN_DB_TESTS: "1"
          DATABASE_URL: postgresql://beken:local-development-only@localhost:5432/beken
        run: pytest backend/tests/test_stage3_database_integration.py backend/tests/test_stage4_database_integration.py ingestion/tests/test_database_integration.py retrieval/tests/test_postgres_integration.py
      - name: Run Qdrant integration test with fake encoder
        env:
          BEKEN_RUN_QDRANT_TESTS: "1"
          QDRANT_URL: http://localhost:6333
        run: pytest retrieval/tests/test_qdrant_integration.py backend/tests/test_private_vectors_integration.py
      - name: Stop test infrastructure
        if: always()
        run: docker compose down --volumes
