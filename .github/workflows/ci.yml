name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./backend[dev]" -e "./ingestion[dev]"
      - run: ruff check backend ingestion
      - run: pytest backend/tests ingestion/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./backend[dev]" -e "./ingestion[dev]"
      - run: docker compose config --quiet
      - run: docker compose up -d --wait postgres
      - name: Validate corpus migrations
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U beken -d beken < "$migration"
          done
      - name: Run database integration tests
        env:
          BEKEN_RUN_DB_TESTS: "1"
          DATABASE_URL: postgresql://beken:local-development-only@localhost:5432/beken
        run: pytest ingestion/tests/test_database_integration.py
      - name: Stop test infrastructure
        if: always()
        run: docker compose down --volumes
